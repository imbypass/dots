scan_timeout = 100
add_newline = true

format = """
$username\
$hostname\
$cmd_duration \
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$python\
$character"""

[cmd_duration]
min_time = 0
show_milliseconds = false
format = "[\ue0b6](fg:bright-black)[ 󰔚 $duration ](bg:bright-black fg:bright-white)[](bg:bright-black)[\ue0b4](fg:bright-black)"

[directory.substitutions]
"Documents" = " 󰈙 Documents"
"Downloads" = "  Downloads"
"Music" = " 󰝚 Music"
"Pictures" = "  Pictures"
"Developer" = " 󰲋 Developer"

[directory]
style = "blue"
home_symbol = " "
truncation_length = 3
truncation_symbol = ""
truncate_to_repo = false
read_only = ""
format = "[\ue0b6](fg:bright-blue)[󰉋 → $path](bg:bright-blue fg:black)[\ue0b4](fg:bright-blue)"

[character]
success_symbol = "[ ](bright-blue) [  ](bright-blue)"
error_symbol = "[ ](bright-red) [  ](bright-blue)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# [cmd_duration]
# format = "[$duration]($style) "
# style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
